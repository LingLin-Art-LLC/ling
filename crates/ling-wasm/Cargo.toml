[package]
name = "ling-wasm"
version = "2030.0.16"
edition = "2021"
description = "Ling language — WebGL2 WASM runtime"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/taellinglin/ling"

[lib]
crate-type = ["cdylib"]

[dependencies]
ling = { path = "../..", package = "ling-lang", version = "2030.1.53", features = ["gl-web"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["OffscreenCanvas", "console", "DedicatedWorkerGlobalScope", "ImageBitmap"] }
console_error_panic_hook = "0.1"

[features]
# Multithreaded browser build: rayon on a Web Worker pool (wasm-bindgen-rayon).
# Build with nightly + RUSTFLAGS="-C target-feature=+atomics,+bulk-memory,+mutable-globals"
# and -Z build-std=panic_abort,std, --target web (see build_threads.sh).
threads = ["dep:wasm-bindgen-rayon"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
