[package]
name = "ling-fido"
version = "2030.0.1"
edition = "2021"
authors = ["Ling Lin <taellinglin@gmail.com>", "Sanny Lin"]
description = "Security keys for LingOS sign-in: CTAPHID framing, FIDO U2F register / authenticate and P-256 signature checks, freestanding (no_std + alloc)"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/taellinglin/ling"
homepage = "https://ling-lang.org"

[dependencies]
sha2 = { version = "0.10", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
# OpenSSH ed25519-sk signatures (ssh.rs): verification only, no alloc / rand.
ed25519-dalek = { version = "2.2", default-features = false }
# CTAP2 hmac-secret (ctap2.rs): the PIN/UV auth protocols' AES-256-CBC, HMAC and HKDF.
aes = { version = "0.8", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
# keyslot.rs: the app secret wrapped under a key's hmac-secret.
chacha20poly1305 = { version = "0.10", default-features = false }

[lib]
name = "ling_fido"
path = "src/lib.rs"
