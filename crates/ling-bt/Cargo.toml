[package]
name = "ling-bt"
version = "2030.0.1"
edition = "2021"
authors = ["Ling Lin <taellinglin@gmail.com>", "Sanny Lin <SannyLing53@gmail.com>"]
description = "Bluetooth host stack for LingOS: HCI, Intel (btintel) firmware download, L2CAP, HID host, link-key store and the SBC encoder, as a sans-IO state machine (no_std + alloc)"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/taellinglin/ling"
homepage = "https://ling-lang.org"

[dependencies]
# firmware pinning (btintel.rs): SHA-256 of the .sfi file before a byte goes to the controller
sha2 = { version = "0.10", default-features = false }
# SBC analysis filterbank (cos)
libm = "0.2"
# LE Secure Connections (smp.rs): AES-128 for AES-CMAC / e(), P-256 ECDH
aes = { version = "0.8", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdh"] }

[lib]
name = "ling_bt"
path = "src/lib.rs"
