name: CI

# Build + test the Ling compiler/runtime workspace on every push and pull request.
#
# The workspace has a member (crates/ling-kernel, the LingOS kernel) with path dependencies on
# three sibling repos -- ../../../bring-browser, ../../../horizon-browser, ../../../ling-messenger --
# and cargo cannot even load the workspace without them. So this repo is checked out at ./ling
# and the siblings next to it, the same layout as a developer machine.

on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ORG: LingLin-Art-LLC

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with: { path: ling }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.ORG }}/bring-browser", path: bring-browser }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.ORG }}/horizon-browser", path: horizon-browser }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.ORG }}/ling-messenger", path: ling-messenger }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "ling -> target" }

      # minifb (graphics) needs X11/Wayland headers; cpal (audio) needs ALSA.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev xorg-dev pkg-config
      - uses: ilammy/setup-nasm@v1
        if: runner.os != 'Linux'

      # ling-kernel is no_std/bare-metal and nightly-only (`#![feature(abi_x86_interrupt)]`,
      # `-Z build-std`), so it is excluded here; the LingOS repo's CI builds it for real.
      # ling-user (the no_std ring-3 runtime) has its own #[panic_handler], so it is kept out of
      # the test graph (E0152 duplicate `panic_impl`) but still builds as an rlib.
      - name: Build
        working-directory: ling
        run: cargo build --workspace --exclude ling-kernel

      - name: Run tests
        if: runner.os == 'Linux'
        working-directory: ling
        run: cargo test --workspace --exclude ling-kernel --exclude ling-user

  lint:
    name: Format & Clippy (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { path: ling }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.ORG }}/bring-browser", path: bring-browser }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.ORG }}/horizon-browser", path: horizon-browser }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.ORG }}/ling-messenger", path: ling-messenger }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev xorg-dev
      - name: Format check
        working-directory: ling
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: ling
        run: cargo clippy --workspace --exclude ling-kernel
